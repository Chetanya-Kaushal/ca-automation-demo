<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger Hackers — Staff</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
main{padding:28px 0 64px}
.login{max-width:400px;margin:12vh auto 0;padding:28px}
.login h1{font-size:1.6rem;letter-spacing:-.025em;margin-bottom:6px}
.login p{color:var(--text-2);font-size:14.5px;margin-bottom:20px}
.login form{display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.stat{padding:16px}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--text-3)}
.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.queue{display:flex;flex-direction:column;gap:12px}
.doc{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.doc .ext{grid-row:span 2}
.doc h3{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc h3 button{color:var(--text);text-align:left;word-break:break-all}
.doc h3 button:hover{color:var(--accent)}
.doc .sub{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.guess{grid-column:2;margin-top:10px;padding:12px;border-radius:12px;background:var(--fill);font-size:13px}
.guess .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guess .top .bar{width:80px}
.guess ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:3px;color:var(--text-2);font-size:12.5px}
.guess li{display:flex;gap:6px;align-items:flex-start}
.guess li .i{margin-top:2px;color:var(--text-3)}
.decide{grid-column:2;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;margin-top:10px}
.empty{padding:48px 16px;text-align:center;color:var(--text-3)}
.empty .i{margin:0 auto 10px;color:var(--green)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td button.fn{color:var(--text);font-weight:500;text-align:left;word-break:break-all}
td button.fn:hover{color:var(--accent)}
.tbl{overflow-x:auto}
.addform{padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.addform .full{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:flex-end}
.upbox{padding:18px;margin-bottom:16px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);z-index:50;display:flex;gap:8px;align-items:center}
@media (max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .decide{grid-template-columns:1fr}
  .addform{grid-template-columns:1fr}
  .doc{grid-template-columns:1fr}.doc .ext{display:none}.guess,.decide{grid-column:1}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="/"><span class="mark">LH</span>Ledger Hackers</a>
  <span class="spacer"></span>
  <button class="icon-btn" id="theme"></button>
  <button class="icon-btn" id="logout" aria-label="Sign out" hidden></button>
</div></header>

<main class="wrap">
  <section class="panel login" id="login" hidden>
    <h1>Staff sign in</h1>
    <p>Enter the staff token your administrator set with <span class="mono">wrangler secret put STAFF_TOKEN</span>.</p>
    <form id="loginForm">
      <label class="f">Staff token<input class="input" type="password" id="token" autocomplete="current-password" required></label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="bar-row">
      <div class="seg" role="tablist" aria-label="Views" id="tabs">
        <button role="tab" data-view="review" aria-selected="true">Needs review <span class="count" id="reviewCount" hidden></span></button>
        <button role="tab" data-view="docs">All documents</button>
        <button role="tab" data-view="clients">Clients</button>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" id="refresh"></button>
        <button class="btn btn-primary btn-sm" id="uploadBtn"></button>
      </div>
    </div>

    <div class="panel upbox" id="upbox" hidden>
      <label class="f">Sender phone or email (optional, helps matching)<input class="input" id="sender" placeholder="e.g. 9820011111 or rajesh@example.com"></label>
      <label class="drop" id="drop" tabindex="0"><span id="dropIcon"></span><b>Choose files or drop them here</b><small>Files are classified the same way as WhatsApp and email</small>
        <input type="file" id="picker" multiple hidden></label>
    </div>

    <div id="view-review"><div class="queue" id="queue"></div></div>
    <div id="view-docs" hidden>
      <div class="bar-row"><div class="seg" id="docFilter">
        <button data-s="all" aria-selected="true">All</button><button data-s="filed">Filed automatically</button><button data-s="confirmed">Confirmed by staff</button><button data-s="review">Needs review</button>
      </div></div>
      <div class="panel tbl"><table><thead><tr><th>File</th><th>Client</th><th>Type</th><th class="hide-sm">Period</th><th class="hide-sm">Channel</th><th>Status</th><th class="hide-sm">Received</th></tr></thead><tbody id="docRows"></tbody></table></div>
    </div>
    <div id="view-clients" hidden>
      <form class="panel addform" id="addClient">
        <label class="f">Name<input class="input" name="name" required placeholder="Rajesh Mehta"></label>
        <label class="f">Type<select class="input" name="kind"><option value="individual">Individual</option><option value="company">Company</option></select></label>
        <label class="f">PAN<input class="input" name="pan" placeholder="ABCDE1234F" maxlength="10" style="text-transform:uppercase"></label>
        <label class="f">WhatsApp number<input class="input" name="phone" inputmode="tel" placeholder="98200 11111"></label>
        <label class="f">Email<input class="input" name="email" type="email" placeholder="rajesh@example.com"></label>
        <label class="f">Group (family or company)<input class="input" name="group_name" placeholder="Mehta family"></label>
        <div class="full"><p class="err" id="clientErr" role="alert"></p><button class="btn btn-primary btn-sm" type="submit" id="addBtn"></button></div>
      </form>
      <div class="panel tbl"><table><thead><tr><th>Name</th><th>Group</th><th class="hide-sm">PAN</th><th class="hide-sm">WhatsApp</th><th class="hide-sm">Email</th><th>Docs</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div>
    </div>
  </section>
</main>

<script type="module">
import { ico, esc, $, extOf, enter, leave, themeButton, sendFiles } from '/shared.js';
themeButton($('#theme'));
$('#logout').innerHTML = ico('out', 18);
$('#refresh').innerHTML = `${ico('refresh', 14)}Refresh`;
$('#uploadBtn').innerHTML = `${ico('upload', 14)}Upload files`;
$('#addBtn').innerHTML = `${ico('plus', 14)}Add client`;
$('#dropIcon').innerHTML = ico('upload', 26);

let token = sessionStorage.getItem('staff') || '', DOC_TYPES = [], clients = [], view = 'review', docFilter = 'all';
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + token, ...(opts.body ? { 'content-type': 'application/json' } : {}), ...opts.headers } });
  if (r.status === 401) { signOut(); throw new Error('Signed out'); }
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(b.error || 'Request failed');
  return b;
};
function toast(msg, icon = 'check') {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `${ico(icon, 15)}<span>${esc(msg)}</span>`; document.body.append(t); enter(t, 12);
  setTimeout(() => t.remove(), 2600);
}
const when = s => { const d = new Date(s.replace(' ', 'T') + 'Z'); return d.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const chan = { upload: ['upload', 'Upload'], whatsapp: ['msg', 'WhatsApp'], email: ['mail', 'Email'] };
const statusPill = s => ({ filed: '<span class="pill t-green">Filed automatically</span>', confirmed: '<span class="pill t-accent">Confirmed</span>', review: '<span class="pill t-amber">Needs review</span>' }[s]);

async function openFile(id) {
  const r = await fetch(`/api/documents/${id}/file`, { headers: { authorization: 'Bearer ' + token } });
  if (!r.ok) return toast('Could not open file', 'alert');
  const url = URL.createObjectURL(await r.blob());
  window.open(url, '_blank', 'noopener'); setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ─── AUTH ──
function signOut() { token = ''; sessionStorage.removeItem('staff'); $('#app').hidden = true; $('#logout').hidden = true; $('#login').hidden = false; }
$('#logout').onclick = signOut;
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); token = $('#token').value.trim(); $('#loginErr').textContent = '';
  try { await start(); sessionStorage.setItem('staff', token); }
  catch (err) { $('#loginErr').textContent = 'That token is not right.'; token = ''; }
};
async function start() {
  const s = await api('/api/session'); DOC_TYPES = s.doc_types;
  $('#login').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
  await refresh();
}

// ─── DATA ──
async function refresh() {
  const [st, cl] = await Promise.all([api('/api/stats'), api('/api/clients')]);
  clients = cl;
  const rate = st.total ? Math.round(100 * st.auto_total / st.total) : 0;
  $('#stats').innerHTML = [[st.review, 'Need review'], [st.filed_today, 'Filed today'], [`${rate}%`, 'Filed without a person'], [st.rules, 'Rules learned']]
    .map(([v, l]) => `<div class="card stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#reviewCount').hidden = !st.review; $('#reviewCount').textContent = st.review;
  if (view === 'review') await renderQueue();
  if (view === 'docs') await renderDocs();
  if (view === 'clients') renderClients();
}

async function renderQueue() {
  const docs = await api('/api/documents?status=review');
  const q = $('#queue');
  if (!docs.length) { q.innerHTML = `<div class="panel empty">${ico('check', 28)}<b>Nothing to review</b>Every document is filed. New ones from WhatsApp, email and uploads appear here when the system isn't sure.</div>`; return; }
  q.querySelector('.empty')?.remove();
  // Keep existing cards (and any half-made choices); only add new ones and drop finished ones
  const ids = new Set(docs.map(d => String(d.id)));
  q.querySelectorAll('.doc').forEach(n => { if (!ids.has(n.dataset.id)) n.remove(); });
  const have = new Set([...q.querySelectorAll('.doc')].map(n => n.dataset.id));
  const fresh = docs.filter(d => !have.has(String(d.id)));
  if (!fresh.length) return;
  const clientOpts = sel => `<option value="">Choose client…</option>` + clients.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}${c.group_name ? ' · ' + esc(c.group_name) : ''}</option>`).join('');
  const typeOpts = sel => DOC_TYPES.map(t => `<option ${t === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
  q.insertAdjacentHTML('afterbegin', fresh.map(d => `
    <article class="card doc" data-id="${d.id}">
      <span class="ext ${extOf(d.filename)}">${extOf(d.filename).toUpperCase()}</span>
      <h3><button class="fn" data-open="${d.id}">${esc(d.filename)}</button></h3>
      <div class="sub">${ico(chan[d.channel][0], 13)}${chan[d.channel][1]}${d.sender ? ' · ' + esc(d.sender) : ''} · ${when(d.created_at)}</div>
      <div class="guess">
        <div class="top">${ico('sparkles', 14)}<span>Best guess: <b>${d.client ? esc(d.client) : 'no client'}</b> · ${esc(d.doc_type)}${d.period ? ' · ' + esc(d.period) : ''}</span>
          <span class="bar"><i style="--v:${d.confidence};background:${d.confidence >= .85 ? 'var(--green)' : 'var(--amber)'}"></i></span><span class="mono">${Math.round(d.confidence * 100)}%</span></div>
        <ul>${d.reasons.map(r => `<li>${ico('alert', 12)}<span>${esc(r)}</span></li>`).join('')}</ul>
      </div>
      <form class="decide">
        <select class="input" name="client_id" aria-label="Client" required>${clientOpts(d.client_id)}</select>
        <select class="input" name="doc_type" aria-label="Document type">${typeOpts(d.doc_type)}</select>
        <button class="btn btn-primary" type="submit">${ico('check', 15)}Confirm</button>
      </form>
    </article>`).join(''));
  fresh.forEach(d => enter(q.querySelector(`.doc[data-id="${d.id}"]`)));
}

$('#queue').addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) openFile(o.dataset.open); });
$('#queue').addEventListener('submit', async e => {
  e.preventDefault();
  const card = e.target.closest('.doc'), f = new FormData(e.target), btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    const r = await api(`/api/documents/${card.dataset.id}/confirm`, { method: 'POST', body: JSON.stringify({ client_id: +f.get('client_id'), doc_type: f.get('doc_type') }) });
    toast(`Confirmed. Files named like “${r.rule.replaceAll('_', ' ')}” will be filed automatically next time.`, 'sparkles');
    await leave(card); refresh();
  } catch (err) { btn.disabled = false; toast(err.message, 'alert'); }
});

async function renderDocs() {
  const docs = await api('/api/documents' + (docFilter === 'all' ? '' : '?status=' + docFilter));
  $('#docRows').innerHTML = docs.length ? docs.map(d => `<tr>
    <td><button class="fn" data-open="${d.id}">${esc(d.filename)}</button></td><td>${d.client ? esc(d.client) : '<span style="color:var(--text-3)">—</span>'}</td>
    <td>${esc(d.doc_type)}</td><td class="hide-sm">${esc(d.period || '—')}</td><td class="hide-sm">${chan[d.channel][1]}</td><td>${statusPill(d.status)}</td><td class="hide-sm">${when(d.created_at)}</td></tr>`).join('')
    : `<tr><td colspan="7" class="empty">No documents yet. Upload some, or send them on WhatsApp or email.</td></tr>`;
}
$('#docRows').addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) openFile(o.dataset.open); });
$('#docFilter').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  docFilter = b.dataset.s; $('#docFilter').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b)); renderDocs();
});

function renderClients() {
  $('#clientRows').innerHTML = clients.length ? clients.map(c => `<tr>
    <td><b>${esc(c.name)}</b><br><small style="color:var(--text-3)">${c.kind === 'company' ? 'Company' : 'Individual'}</small></td><td>${esc(c.group_name || '—')}</td>
    <td class="hide-sm mono">${esc(c.pan || '—')}</td><td class="hide-sm">${esc(c.phone || '—')}</td><td class="hide-sm">${esc(c.email || '—')}</td><td>${c.documents}</td>
    <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" data-link="${esc(c.upload_token)}">${ico('link', 14)}Copy upload link</button>${c.documents ? '' : `<button class="icon-btn" data-del="${c.id}" aria-label="Delete ${esc(c.name)}" style="display:inline-grid">${ico('trash', 15)}</button>`}</td></tr>`).join('')
    : `<tr><td colspan="7" class="empty">Add your clients so documents can be matched to them.</td></tr>`;
}
$('#clientRows').addEventListener('click', async e => {
  const l = e.target.closest('[data-link]'), d = e.target.closest('[data-del]');
  if (l) {
    const url = `${location.origin}/upload?t=${l.dataset.link}`;
    try { await navigator.clipboard.writeText(url); toast('Upload link copied. Send it to the client.', 'link'); } catch (err) { prompt('Copy this upload link', url); }
  }
  if (d && confirm('Delete this client? This cannot be undone.')) {
    try { await api('/api/clients/' + d.dataset.del, { method: 'DELETE' }); toast('Client deleted'); refresh(); } catch (err) { toast(err.message, 'alert'); }
  }
});
$('#addClient').onsubmit = async e => {
  e.preventDefault(); $('#clientErr').textContent = '';
  try {
    const c = await api('/api/clients', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    e.target.reset(); toast(`${c.name} added`); refresh();
  } catch (err) { $('#clientErr').textContent = err.message; }
};

// ─── VIEWS / UPLOAD ──
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.view;
  $('#tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b));
  ['review', 'docs', 'clients'].forEach(v => ($('#view-' + v).hidden = v !== view));
  refresh();
});
$('#refresh').onclick = () => refresh().then(() => toast('Up to date'));
$('#uploadBtn').onclick = () => { $('#upbox').hidden = !$('#upbox').hidden; if (!$('#upbox').hidden) enter($('#upbox')); };
async function upload(files) {
  if (!files.length) return;
  toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`, 'upload');
  try {
    const { results } = await sendFiles('/api/upload', files, { authorization: 'Bearer ' + token }, { sender: $('#sender').value.trim() });
    const filed = results.filter(r => r.status === 'filed').length, bad = results.filter(r => r.error).length;
    toast(`${filed} filed automatically · ${results.length - filed - bad} need review${bad ? ` · ${bad} rejected` : ''}`, 'sparkles');
    refresh();
  } catch (err) { toast(err.message, 'alert'); }
}
const drop = $('#drop'), picker = $('#picker');
picker.onchange = () => { upload([...picker.files]); picker.value = ''; };
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } });
['dragenter', 'dragover'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));

// New WhatsApp/email arrivals show up without a manual refresh
setInterval(() => { if (token && !document.hidden && !$('#app').hidden) refresh().catch(() => {}); }, 20000);

if (token) start().catch(signOut); else $('#login').hidden = false;
</script>
</body>
</html>
