<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Send documents — Ledger Hackers</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<style>
main{max-width:560px;margin:0 auto;padding:clamp(40px,8vw,80px) 16px 48px}
h1{font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.08;letter-spacing:-.03em;font-weight:700}
.lead{color:var(--text-2);font-size:17px;margin:12px 0 28px}
.box{padding:20px}
.list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px}
.row .meta{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{font-size:12.5px;color:var(--text-3)}
.row .st{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.row .bar{margin-top:6px}
.bad{padding:28px;text-align:center}
.bad .i{margin:0 auto 12px;color:var(--amber)}
.note{font-size:12.5px;color:var(--text-3);margin-top:20px;display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><span class="brand"><span class="mark">LH</span>Ledger Hackers</span><span class="spacer"></span><button class="icon-btn" id="theme"></button></div></header>
<main>
  <section id="ok" hidden>
    <h1 id="hello">Send your documents</h1>
    <p class="lead">Drop files here. We'll sort them to the right person and filing automatically.</p>
    <div class="panel box">
      <label class="drop" id="drop" tabindex="0">
        <span id="dropIcon"></span><b>Choose files or drop them here</b><small>PDF, Excel, CSV or photos · up to 20 MB each</small>
        <input type="file" id="picker" multiple hidden accept=".pdf,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.heic,.zip">
      </label>
      <ul class="list" id="list" aria-live="polite"></ul>
    </div>
    <p class="note" id="note"></p>
  </section>
  <section id="bad" class="panel bad" hidden>
    <span id="badIcon"></span>
    <h1 style="font-size:1.5rem">This upload link doesn't work</h1>
    <p class="lead" style="margin:8px 0 0">Ask your CA for a new link.</p>
  </section>
</main>
<script type="module">
import { ico, esc, $, extOf, enter, themeButton, sendFiles } from '/shared.js';
themeButton($('#theme'));
$('#dropIcon').innerHTML = ico('upload', 28);
$('#badIcon').innerHTML = ico('alert', 28);
$('#note').innerHTML = `${ico('lock', 14)}<span>This link is private to you. Files go straight to your CA's secure storage.</span>`;

const t = new URLSearchParams(location.search).get('t') || '';
const info = await fetch('/api/upload-info?t=' + encodeURIComponent(t)).then(r => (r.ok ? r.json() : null)).catch(() => null);
if (!info) { $('#bad').hidden = false; } else {
  $('#ok').hidden = false;
  $('#hello').textContent = `Hi ${info.name}, send your documents`;
}

async function upload(files) {
  if (!files.length) return;
  for (const f of files) {
    const li = document.createElement('li');
    li.className = 'card row';
    li.innerHTML = `<span class="ext ${extOf(f.name)}">${extOf(f.name).toUpperCase()}</span><span class="meta"><b>${esc(f.name)}</b><small>${(f.size / 1048576).toFixed(1)} MB</small><div class="bar"><i></i></div></span><span class="st"></span>`;
    $('#list').prepend(li); enter(li);
    const bar = li.querySelector('.bar i'), st = li.querySelector('.st');
    try {
      const { results: [r] } = await sendFiles('/api/upload?t=' + encodeURIComponent(t), [f], {}, {}, p => bar.style.setProperty('--v', p));
      li.querySelector('.bar').remove();
      if (r.error) { st.className = 'st'; st.style.color = 'var(--red)'; st.innerHTML = `${ico('x', 14)}${esc(r.error)}`; }
      else {
        st.style.color = 'var(--green)'; st.innerHTML = `${ico('check', 14)}Received`;
        li.querySelector('small').textContent = r.status === 'filed' ? `Filed for ${r.client} · ${r.doc_type}` : 'Your CA will check this one';
      }
    } catch (e) {
      li.querySelector('.bar')?.remove(); st.style.color = 'var(--red)'; st.innerHTML = `${ico('x', 14)}${esc(e.message)}`;
    }
  }
}
const drop = $('#drop'), picker = $('#picker');
picker.addEventListener('change', () => { upload([...picker.files]); picker.value = ''; });
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } });
['dragenter', 'dragover'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(k => drop.addEventListener(k, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));
</script>
</body>
</html>
